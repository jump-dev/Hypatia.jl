name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }} - ${{ matrix.test_files }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_files: 'cone'
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_files: 'polyutils;native'
          - version: '1'
            os: ubuntu-latest
            arch: x64
            test_files: 'moi'
          # Julia 1.10 is for compatibility, so it skips the cone tests
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            test_files: 'polyutils;native'
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            test_files: 'moi'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          HYPATIA_TEST_FILES: ${{ matrix.test_files }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
